# The tests that need no radio and no sound device, on every push and pull request,
# on four distributions. tests/modes-test.sh and the rttymodem selftest stay local: they
# want a sound server and the .venv.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            image: ubuntu:24.04
            install: >-
              apt-get update &&
              apt-get install -y --no-install-recommends
              python3 python3-serial netcat-openbsd libhamlib-utils procps tmux
          - name: Debian
            image: debian:stable
            install: >-
              apt-get update &&
              apt-get install -y --no-install-recommends
              python3 python3-serial netcat-openbsd libhamlib-utils procps tmux
          - name: Fedora
            image: fedora:latest
            install: >-
              dnf install -y
              python3 python3-pyserial netcat hamlib procps-ng tmux
          - name: Arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm
              python python-pyserial openbsd-netcat hamlib procps-ng tmux
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pyserial for d750d, what tests.sh calls (nc and hamlib's rigctl), and tmux for the workspace test
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7

      - name: Put the verbs on the path
        run: echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: The verbs, against the simulator (tests.sh)
        run: |
          tests/test-env.sh > /dev/null 2>&1 &
          for _ in $(seq 1 60); do nc -z 127.0.0.1 4543 2>/dev/null && break; sleep 0.25; done
          rc=0; tests/tests.sh || rc=$?
          kill $(cat "$HOME/.local/share/d750ctrl/log/test/pids") 2>/dev/null || true
          sleep 2
          exit $rc

      - name: What the verbs print, against written rules (output-rules-test.py)
        run: |
          tests/test-env.sh > /dev/null 2>&1 &
          for _ in $(seq 1 60); do nc -z 127.0.0.1 4543 2>/dev/null && break; sleep 0.25; done
          rc=0; python3 -I tests/output-rules-test.py || rc=$?
          kill $(cat "$HOME/.local/share/d750ctrl/log/test/pids") 2>/dev/null || true
          sleep 2
          exit $rc

      - name: The rig screen's keys, with no terminal (keymap-test.py)
        run: python3 -I tests/keymap-test.py

      - name: The rig screen's three views, with no terminal (screen-model-test.py)
        run: python3 -I tests/screen-model-test.py

      - name: The rig screen, in a pseudo terminal (d750ctrl-test.py)
        run: python3 tests/d750ctrl-test.py

      - name: The rig screen's tmux workspace, in real tmux (d750ctrl-tmux-test.py)
        run: python3 tests/d750ctrl-tmux-test.py

      - name: APRS (d750-aprs-test.py)
        run: python3 -I tests/d750-aprs-test.py

      - name: APRS chat (aprschat-test.py)
        run: python3 -I tests/aprschat-test.py

      - name: The station tool, with fake services (station-test.py)
        run: python3 -I station/station-test.py

      - name: Notices through ntfy, with a fake curl (notify-test.py)
        run: python3 -I station/notify-test.py
